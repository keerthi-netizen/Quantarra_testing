name: Daily Shakeout — POC & Prod

on:
  schedule:
    # 9:00 AM IST = 03:30 UTC
    - cron: '30 3 * * *'
    # 7:00 PM IST = 13:30 UTC
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Run against specific env (poc, prod, or both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - poc
          - prod

env:
  # POC Environment
  POC_BASE_URL: https://poc.quantarra.com
  POC_MC_URL: https://poc.quantarra.com:4002
  POC_AUDIT_URL: https://poc.quantarra.com:4003
  POC_API_URL: https://poc.quantarra.com/api/v1
  POC_ADMIN_EMAIL: ${{ secrets.POC_ADMIN_EMAIL }}
  POC_ADMIN_PASSWORD: ${{ secrets.POC_ADMIN_PASSWORD }}

  # Prod Environment
  PROD_BASE_URL: https://app.quantarra.com
  PROD_MC_URL: https://mc.quantarra.com
  PROD_AUDIT_URL: https://audit.quantarra.com
  PROD_API_URL: https://app.quantarra.com/api/v1
  PROD_ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
  PROD_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}

  # Shared credentials (contributor for RBAC tests)
  CONTRIBUTOR_EMAIL: ${{ secrets.CONTRIBUTOR_EMAIL }}
  CONTRIBUTOR_PASSWORD: ${{ secrets.CONTRIBUTOR_PASSWORD }}
  POC_CONTRIBUTOR_EMAIL: ${{ secrets.POC_CONTRIBUTOR_EMAIL }}
  POC_CONTRIBUTOR_PASSWORD: ${{ secrets.POC_CONTRIBUTOR_PASSWORD }}
  PROD_CONTRIBUTOR_EMAIL: ${{ secrets.PROD_CONTRIBUTOR_EMAIL }}
  PROD_CONTRIBUTOR_PASSWORD: ${{ secrets.PROD_CONTRIBUTOR_PASSWORD }}

  # Jira (for auto-ticket creation on failure)
  JIRA_BASE_URL: https://quantarra.atlassian.net
  JIRA_PROJECT_KEY: PRJAT
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  # Email (for consolidated report)
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  REPORT_RECIPIENTS: ${{ secrets.SHAKEOUT_REPORT_RECIPIENTS }}

jobs:
  shakeout-poc:
    name: Shakeout — POC
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.environment != 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Automation/package-lock.json

      - name: Install dependencies
        working-directory: Automation
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Automation
        run: npx playwright install chromium --with-deps

      - name: Run Daily Shakeout — POC
        working-directory: Automation
        env:
          ENV: poc
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/results.json
        run: npx playwright test --project=daily-shakeout --reporter=list,json,html || true

      - name: Upload POC results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shakeout-poc-results
          path: Automation/reports/results.json
          retention-days: 30

      - name: Upload POC screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shakeout-poc-screenshots
          path: Automation/reports/artifacts/
          retention-days: 7

  shakeout-prod:
    name: Shakeout — Prod
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.environment != 'poc' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Automation/package-lock.json

      - name: Install dependencies
        working-directory: Automation
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Automation
        run: npx playwright install chromium --with-deps

      - name: Run Daily Shakeout — Prod
        working-directory: Automation
        env:
          ENV: prod
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/results.json
        run: npx playwright test --project=daily-shakeout --reporter=list,json,html || true

      - name: Upload Prod results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shakeout-prod-results
          path: Automation/reports/results.json
          retention-days: 30

      - name: Upload Prod screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shakeout-prod-screenshots
          path: Automation/reports/artifacts/
          retention-days: 7

  report-and-notify:
    name: Consolidate Report & Notify
    runs-on: ubuntu-latest
    needs: [shakeout-poc, shakeout-prod]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Automation/package-lock.json

      - name: Install dependencies
        working-directory: Automation
        run: npm ci

      - name: Download POC results
        uses: actions/download-artifact@v4
        with:
          name: shakeout-poc-results
          path: Automation/reports/poc
        continue-on-error: true

      - name: Download Prod results
        uses: actions/download-artifact@v4
        with:
          name: shakeout-prod-results
          path: Automation/reports/prod
        continue-on-error: true

      - name: Generate consolidated report & notify
        working-directory: Automation
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.SHAKEOUT_REPORT_RECIPIENTS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx tsx scripts/shakeout-notify.ts
